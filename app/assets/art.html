<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>App icon and splash (render source)</title>
<style>
  /* ?art=icon → 1024x1024 app icon (no alpha; iOS rounds the corners itself)
     ?art=splash → 2732x2732 launch image, centred mark, safe at any crop
     variant=dark: flat near-black ground for iOS 18's dark Home Screen; variant=tinted: white on transparent */
  html, body { margin: 0; background: #0d120e; }
  .icon { width: 1024px; height: 1024px; background: radial-gradient(circle at 50% 46%, #17201a 0, #0d120e 62%); display: grid; place-items: center; overflow: hidden; }
  .splash { width: 2732px; height: 2732px; background: #0d120e; display: grid; place-items: center; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script>
(function () {
  var q = {}; location.search.replace(/^\?/, "").split("&").forEach(function (kv) { var p = kv.split("="); if (p[0]) q[p[0]] = decodeURIComponent(p[1] || ""); });
  var art = q.art || "icon", S = art === "icon" ? 1024 : 2732, variant = q.variant || "";
  document.body.innerHTML = '<div class="' + art + '"><canvas width="' + S + '" height="' + S + '"></canvas></div>';
  var cv = document.querySelector("canvas"), ctx = cv.getContext("2d");
  if (variant === "tinted") { document.documentElement.style.background = "transparent"; document.body.style.background = "transparent"; document.querySelector("." + art).style.background = "transparent"; }
  if (variant === "dark") { document.querySelector("." + art).style.background = "#0a0d0a"; }
  var tinted = variant === "tinted";
  var BR = tinted ? "rgba(255,255,255," : "rgba(211,168,81,", CY = tinted ? "rgba(255,255,255," : "rgba(100,186,200,";
  var c = S / 2;
  // faint plate rings behind everything: the cymatics, quietly
  ctx.lineWidth = S * 0.0016; ctx.strokeStyle = tinted ? "rgba(255,255,255,.16)" : "rgba(139,149,104,.16)";
  for (var i = 1; i <= 6; i++) { ctx.beginPath(); ctx.arc(c, c, (S * 0.07) * i, 0, Math.PI * 2); ctx.stroke(); }
  if (!tinted) {
    // one cyan nodal ring, glowing, as the plates do
    ctx.save(); ctx.shadowColor = CY + ".8)"; ctx.shadowBlur = S * 0.02; ctx.strokeStyle = CY + ".55)"; ctx.lineWidth = S * 0.006;
    ctx.beginPath(); ctx.arc(c, c, S * (art === "icon" ? 0.40 : 0.22), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  // the Eye of Ra: the app's mark. Same paths as the inline SVG on the pages (24-unit box).
  var EYE = ["M2.4 7.4C6.4 3.2 17.6 3.2 21.6 7.4", "M1.8 12C6 6.4 18 6.4 22.2 12C18 17.6 6 17.6 1.8 12Z", "M22.2 12L24 11.2M15 17.4L15.5 22.6M9 17.3C7.8 19.7 5.7 21.7 3.4 21C2 20.5 2.2 18.7 3.6 18.6C4.6 18.4 4.9 19.3 4.5 19.6"];
  var span = art === "icon" ? 0.64 : 0.34, k = S * span / 24, off = (S - 24 * k) / 2;
  // a soft brass halo behind the mark, so it sits in the dark rather than on it
  if (!tinted) {
    var halo = ctx.createRadialGradient(c, c, 0, c, c, S * (art === "icon" ? 0.36 : 0.2));
    halo.addColorStop(0, BR + ".14)"); halo.addColorStop(1, BR + "0)");
    ctx.fillStyle = halo; ctx.fillRect(0, 0, S, S);
  }
  ctx.save(); ctx.translate(off, off + k * 0.5); ctx.scale(k, k);
  // brass with light falling from above: pale at the brow, deeper under the eye
  var stroke = tinted ? "#fff" : (function () { var g = ctx.createLinearGradient(0, 3, 0, 23); g.addColorStop(0, "#e8c56e"); g.addColorStop(0.5, "#d3a851"); g.addColorStop(1, "#b98d3c"); return g; })();
  ctx.strokeStyle = stroke; ctx.fillStyle = stroke; ctx.lineWidth = tinted ? 1.8 : 1.45; ctx.lineCap = "round"; ctx.lineJoin = "round";
  EYE.forEach(function (d) { ctx.stroke(new Path2D(d)); });
  ctx.beginPath(); ctx.arc(12, 12, 2.9, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(12, 12, 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
})();
</script>
</body>
</html>
